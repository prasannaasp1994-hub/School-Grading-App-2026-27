name: Build School Grading APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP" -d project

      - name: Setup Android SDK manually
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          SETTINGS=$(find project \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Grading-App-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
